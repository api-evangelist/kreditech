aid: kreditech
name: Monedo
description: >-
  Monedo, founded in Hamburg in 2012 as Kreditech and renamed Monedo in March 2020, was a
  German online consumer lender that underwrote short-term and installment credit in Poland,
  Spain, Russia, Romania, India and Mexico using a self-learning machine-learning scoring
  engine over thousands of alternative data points instead of traditional bureau scores.
  Backed by Peter Thiel, J.C. Flowers and Naspers, it was valued above EUR 230m in 2017. It
  marketed a business-facing Lending-as-a-Service / Credit-as-a-Service partner API that let
  retailers, telcos, banks and payment providers embed its credit products and point-of-sale
  financing, but that surface was sales-gated for its whole life: the company never operated
  a public developer portal, never published a reference, and never published a
  machine-readable contract. Monedo filed for insolvency in a Hamburg court in September 2020
  and ceased operations in December 2020. Both monedo.com and kreditech.com lapsed and were
  re-registered by unrelated parties in 2022 - monedo.com is now a GoDaddy aftermarket
  listing offered for sale - so no company-controlled web or API surface remains.
