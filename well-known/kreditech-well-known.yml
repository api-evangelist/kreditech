conclusion: >-
  Monedo marketed a business-facing Lending-as-a-Service / Credit-as-a-Service partner API
  to retailers, telcos and payment providers, but that surface was sales-gated for its whole
  life: no public developer portal, no reference, and no machine-readable contract was ever
  published, and no Wayback record of api./developer. subdomains exists. The company is dead
  and holds neither of the two hosts that carry its names. This file is a historical record,
  not a thin profile. Any future round should re-read host_status before probing monedo.com
  or kreditech.com again, and must not promote any 200 or 202 from either host into a hit.
