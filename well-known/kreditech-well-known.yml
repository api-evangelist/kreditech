name: Monedo (Kreditech) well-known + contract discovery probe
description: >-
  Negative probe record for Monedo, founded in Hamburg in 2012 as Kreditech and renamed
  Monedo in March 2020. The company filed for insolvency in a Hamburg court in September
  2020 and ceased operations in December 2020. BOTH of its former hosts were allowed to
  lapse and were re-registered in 2022 by unrelated parties: monedo.com is now a GoDaddy /
  Afternic aftermarket listing offered for sale, and kreditech.com sits behind a SiteGround
  robot-challenge wall on a NameCheap privacy registration. Neither host is controlled by
  the company, so nothing served from either may be attributed to Monedo. monedo.com
  answers HTTP 200 with the SAME 114-byte HTML redirect shell for EVERY path, including
  every /.well-known/* path and every spec path, and its DNS is a wildcard that resolves
  api./developer./docs./app./partner. to the same parking IPs. NONE of these 200s is a
  document. No WellKnown, SecurityTxt, AgentCard, LLMsTxt, OpenAPI, Packages or SDKs
  pointer is emitted from this probe, and none should ever be emitted from it in a later
  round.

